<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CineFrame paint test</title>
<style>
  html,body{margin:0;background:#000;color:#eee;font:14px/1.4 system-ui,sans-serif}
  .fixed-top{position:fixed;inset:0 0 auto 0;height:44px;background:#1c1c1e;display:flex;align-items:center;padding:0 14px;z-index:30;font-weight:700}
  main{padding:64px 16px 32px}
  .bar{height:28px;border-radius:6px;margin:10px 0;color:#000;font-weight:700;display:flex;align-items:center;padding:0 8px;min-width:0}
  .r300{width:300px;background:#ff4d4d}
  .r100{width:100%;background:#3ddc84}
  .r50{width:50%;background:#4d8dff}
  .cards{display:flex;gap:12px;margin-top:16px}
  .card{width:158px;height:237px;border-radius:8px;background:linear-gradient(135deg,#333,#555);display:flex;align-items:flex-end;color:#aaa;font-size:11px;padding:8px}
  #out{margin-top:20px;padding:12px;background:#141414;border:1px solid #333;border-radius:8px;white-space:pre-line;font-family:monospace;font-size:12px}
</style>
</head>
<body>
<div class="fixed-top">FIXED HEADER — spans full width?</div>
<main>
  <div>Three bars below: 300px fixed, 100% fluid, 50% fluid. On a 360 CSS px screen the red bar should end at ~83% of the width, level with the green bar minus a stub.</div>
  <div class="bar r300">300px red</div>
  <div class="bar r100">100% green</div>
  <div class="bar r50">50% blue</div>
  <div class="cards">
    <div class="card">158×237 card A</div>
    <div class="card">158×237 card B</div>
  </div>
  <div id="out">measuring…</div>
</main>
<script>
function out(){
  var v=window.visualViewport;
  document.getElementById('out').textContent=
    'innerWidth: '+window.innerWidth+'\n'+
    'documentElement.clientWidth: '+document.documentElement.clientWidth+'\n'+
    'screen.width: '+window.screen.width+'\n'+
    'devicePixelRatio: '+window.devicePixelRatio+'\n'+
    'visualViewport.scale: '+(v?v.scale.toFixed(2):'n/a')+'\n'+
    'visualViewport.width: '+(v?v.width.toFixed(0):'n/a')+'\n\n'+
    'If the red bar stops near the MIDDLE of the screen while the green\n'+
    'bar (and the header) cover the full width, this page proves the\n'+
    'browser is painting page content at the wrong scale — the same\n'+
    'fault seen on the main app. Not a CineFrame code bug.';
}
addEventListener('resize',out);addEventListener('scroll',out);out();
</script>
</body>
</html>
