name: Provider watchdog

on:
  schedule:
    - cron: '37 4 * * *' # daily probe, off the top of the hour
  workflow_dispatch: {}   # manual re-probe button
  push:
    branches: [main]
    paths:
      # Register/refresh the schedule after any run, and re-probe when the
      # watchdog itself changes. The probe's own commit touches ONLY
      # provider-status.json, so this can never loop.
      - '.github/workflows/provider-watchdog.yml'
      - '.github/scripts/**'

permissions:
  contents: write
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probe providers, publish status, manage outage issues
        run: python .github/scripts/provider_check.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
