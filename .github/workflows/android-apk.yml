name: Build CineFrame Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'sw.js'
      - 'scripts/**'
      - 'server.cjs'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Run source checks
        run: npm test
      - name: Prepare web assets
        run: npm run build:web
      - name: Generate Android project
        run: npx cap add android
      - name: Generate Android app icons and splash assets
        run: npx capacitor-assets generate --android --assetPath assets --androidProject android --splashBackgroundColor '#000000' --iconBackgroundColor '#080808'
      - name: Sync Capacitor plugins and web assets
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cineframe-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
