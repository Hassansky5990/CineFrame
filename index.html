<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Discover movies, series and anime on CineFrame. Explore ratings, trailers, recommendations and your personal watchlist.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23e50914%22/%3E%3Cpath d=%22M22 14v36l29-18z%22 fill=%22white%22/%3E%3C/svg%3E">
<title>CineFrame — Movies & Series</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{color-scheme:dark;--bg:#000;--panel:#1c1c1e;--panel2:#2c2c2e;--text:#fff;--muted:#8e8e93;--soft:#ebebf5a6;--gold:#ffd60a;--glass:#ffffff1f;--hair:#ffffff1a;--gutter:clamp(16px,4vw,64px);--gap:20px;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
body.locked{overflow:hidden}
button,input,select{font:inherit;letter-spacing:inherit}button{cursor:pointer}a{color:inherit}[hidden],.hidden{display:none!important}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
::selection{background:#ffffff40}
*{scrollbar-width:thin;scrollbar-color:#ffffff30 transparent}

/* Top bar: frosted glass with a floating centre pill */
.topbar{position:fixed;inset:0 0 auto;z-index:30;display:flex;align-items:center;gap:12px;padding:14px var(--gutter);background:linear-gradient(180deg,#000000b3,#00000000);transition:background .35s,box-shadow .35s}
.topbar.scrolled{background:#000000a6;backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);box-shadow:0 1px 0 var(--hair)}
.brand{display:flex;align-items:center;gap:10px;font-size:1.18rem;font-weight:600;letter-spacing:-.04em;text-decoration:none;text-transform:lowercase;white-space:nowrap}
.brand em{font-style:normal;font-weight:400;color:var(--soft)}
.brandmark{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:linear-gradient(180deg,#fff,#c7c7cc);color:#000;font-size:10px;padding-left:2px;box-shadow:0 4px 14px #0008,inset 0 -1px 0 #0003}
.nav{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:#ffffff14;border:1px solid var(--hair);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:0 8px 30px #0006}
.nav button{display:inline-flex;align-items:center;border:0;border-radius:999px;background:none;color:var(--soft);padding:8px 20px;font-size:.88rem;font-weight:500;transition:background .25s,color .25s}
.nav button:hover{color:#fff}.nav button.active{background:#ffffff29;color:#fff;font-weight:600}
.nav-icon{display:none}
.mobile-nav-icon{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.searchwrap{position:relative;display:flex;align-items:center;margin-left:auto;width:min(260px,22vw)}
.searchwrap span{position:absolute;left:14px;font-size:19px;color:var(--soft);pointer-events:none}
.searchwrap input{width:100%;min-width:0;height:40px;border-radius:999px;border:1px solid var(--hair);background:#ffffff14;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#fff;padding:0 16px 0 42px;font-size:.88rem;transition:background .25s,border-color .25s}
.searchwrap input:focus{outline:none;background:#ffffff26;border-color:#ffffff59}.searchwrap input::placeholder{color:var(--muted)}
.watch-btn{display:flex;align-items:center;gap:8px;height:40px;padding:0 8px 0 14px;border-radius:999px;border:1px solid var(--hair);background:#ffffff14;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#fff;font-size:.86rem;font-weight:600;white-space:nowrap;transition:background .25s}
.watch-btn:hover{background:#ffffff26}.watch-btn>span:first-child{font-size:1.1rem;line-height:1}
.watch-btn b{display:grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:#fff;color:#000;font-size:.74rem}

/* Hero: an inset, rounded feature card */
.hero{position:relative;isolation:isolate;margin:80px var(--gutter) 0;height:min(76vh,780px);min-height:520px;border-radius:32px;display:flex;align-items:flex-end;justify-content:center;padding:0 28px 60px;overflow:hidden;background:var(--panel);text-align:center;box-shadow:0 50px 120px -30px #000,0 0 0 1px var(--hair)}
.hero-backdrop{position:absolute;inset:0;z-index:-2;background:var(--panel) center 20%/cover no-repeat;animation:heroReveal 1.2s var(--ease) both}
.hero:after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(0deg,#000000f2 0%,#000000a6 28%,#00000026 58%,transparent 80%),radial-gradient(120% 90% at 50% 100%,#00000066,transparent 60%)}
.hero:before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit;box-shadow:inset 0 1px 0 #ffffff33,inset 0 0 0 1px #ffffff14}
.hero-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;max-width:720px;animation:copyReveal .9s .15s var(--ease) both}
.eyebrow{display:flex;align-items:center;justify-content:center;color:var(--soft);font-size:.92rem;font-weight:600}
.eyebrow .dot{display:none}
.hero h1{font-size:clamp(2.7rem,6.2vw,5.6rem);font-weight:700;line-height:1.02;letter-spacing:-.045em;margin:10px 0 14px;text-wrap:balance;text-shadow:0 6px 40px #0008}
.meta{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;color:var(--soft);font-size:.92rem;font-weight:500;margin-bottom:14px}
.rating{color:var(--gold);font-weight:700}
.tag{padding:2px 9px;border-radius:6px;background:#ffffff24;color:#fff;font-size:.72rem;font-weight:600;letter-spacing:.02em}
.hero p{max-width:560px;margin:0 0 26px;color:#ffffffd9;font-size:1.04rem;line-height:1.55;text-shadow:0 2px 16px #000a;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.primary,.secondary,.quiet{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:50px;padding:0 28px;border:0;border-radius:999px;font-size:1rem;font-weight:600;transition:background .25s,transform .25s var(--ease),box-shadow .25s}
.primary,.secondary{background:#fff;color:#000;box-shadow:0 10px 30px -8px #ffffff55}
.primary:hover,.secondary:hover{background:#f2f2f7;transform:scale(1.04)}
.quiet{background:var(--glass);color:#fff;border:1px solid var(--hair);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%)}
.quiet:hover{background:#ffffff38;transform:scale(1.04)}
.primary:active,.secondary:active,.quiet:active{transform:scale(.97)}
.action-icon{display:block;width:20px;height:20px;flex:0 0 20px}
.action-icon-info{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Shelves */
#homeSections{position:relative;z-index:4;margin-top:40px}
.section{position:relative;padding:0 0 6px}
.section-heading{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:0 var(--gutter)}
.section h2{display:flex;align-items:center;margin:0;font-size:clamp(1.15rem,1.7vw,1.5rem);font-weight:700;letter-spacing:-.03em}
.section h2:after{content:none}
.section-sub{color:var(--muted);font-size:.84rem}
#homeSections .section-sub{display:none}
.home-shelf .section-heading{align-items:center;margin-bottom:2px}.home-shelf .explore-more{margin-left:auto;flex:0 0 auto;padding:5px 0 5px 12px;border:0;background:transparent;color:#a1a1aa;font-size:.82rem;font-weight:600;letter-spacing:.005em;white-space:nowrap;cursor:pointer;transition:color .18s}.home-shelf .explore-more:hover{color:#fff}.home-shelf .explore-more:after{content:' →';display:inline-block;margin-left:3px;color:#777;transition:transform .18s,color .18s}.home-shelf .explore-more:hover:after{color:#fff;transform:translateX(3px)}
.popular-tools{display:flex;align-items:center;gap:13px;margin-left:auto}
.popular-progress{width:clamp(34px,5vw,68px);height:3px;overflow:hidden;border-radius:99px;background:#ffffff20}
.popular-progress span{display:block;width:0;height:100%;border-radius:inherit;background:var(--gold);transition:width .25s ease}
.popular-count{min-width:42px;color:#ffffff9c;font-size:.72rem;font-variant-numeric:tabular-nums;letter-spacing:.08em;text-align:center}
.popular-arrows{display:flex;align-items:center;gap:7px}
.popular-arrow{width:38px;height:38px;display:grid;place-items:center;border:1px solid #ffffff24;border-radius:50%;background:linear-gradient(145deg,#ffffff18,#ffffff07);color:#fff;box-shadow:inset 0 1px 0 #ffffff12;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:background .2s,border-color .2s,transform .2s,color .2s}
.popular-arrow svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.popular-arrow:hover:not(:disabled){background:var(--gold);border-color:var(--gold);color:#000;transform:translateY(-1px)}
.popular-arrow:disabled{opacity:.28;cursor:default}
.home-shelf .row-scroll{scroll-behavior:smooth}
@media(max-width:760px){.popular-tools{gap:8px}.popular-progress{width:28px}.popular-count{min-width:35px;font-size:.66rem}.popular-arrow{width:34px;height:34px}.popular-arrows{gap:5px}}
.row-scroll{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(190px,18vw,252px);gap:var(--gap);overflow-x:auto;overflow-y:hidden;padding:26px var(--gutter) 40px;margin:-10px 0 -14px;scroll-snap-type:x proximity;scroll-padding-inline:var(--gutter);scrollbar-width:none;overscroll-behavior-inline:contain;align-items:start;min-width:0}
.row-scroll::-webkit-scrollbar{display:none}
@media(hover:hover) and (pointer:fine){.home-shelf{position:relative}.home-shelf .section-heading h2:after{content:none}.shelf-open-all{display:inline-grid;place-items:center;width:28px;height:28px;margin-left:9px;padding:0;border:1px solid #ffffff20;border-radius:50%;background:#ffffff08;color:#a7a7ad;vertical-align:middle;transition:background .2s,border-color .2s,color .2s,transform .2s}.shelf-open-all svg{display:block;width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.shelf-open-all{flex:0 0 auto;line-height:0}.shelf-open-all:hover{background:#ffffff16;border-color:#ffffff45;color:#fff;transform:translateX(2px)}.shelf-open-all:focus-visible{outline:2px solid #fff;outline-offset:3px}}
.movie-card{position:relative;min-width:0;scroll-snap-align:start;cursor:pointer;border-radius:16px;transition:transform .45s var(--ease);will-change:transform}
.movie-card:hover,.movie-card:focus-within{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.06);z-index:9}
.poster{display:block;width:100%;height:auto;aspect-ratio:2/3;object-fit:cover;background:var(--panel);border-radius:16px;box-shadow:0 10px 24px -8px #000c;transition:box-shadow .45s var(--ease)}
.movie-card:hover .poster,.movie-card:focus-within .poster{box-shadow:0 34px 60px -14px #000,0 18px 36px -18px #ffffff2e}
.movie-card:before{content:"";position:absolute;left:0;right:0;top:0;aspect-ratio:2/3;border-radius:16px;z-index:2;pointer-events:none;box-shadow:inset 0 0 0 1px #ffffff1f,inset 0 1px 0 #ffffff2e;background:radial-gradient(circle at var(--mx,50%) var(--my,25%),#ffffff38,transparent 55%) no-repeat;background-size:100% 100%;opacity:0;transition:opacity .35s}
.movie-card:hover:before,.movie-card:focus-within:before{opacity:1}
.card-copy{padding:12px 4px 0}
.card-title{font-size:.88rem;font-weight:600;line-height:1.3;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{display:flex;gap:10px;align-items:center;margin-top:2px;font-size:.78rem;color:var(--muted)}
.card-meta .score{color:var(--gold);font-weight:600}
.card-watch{position:absolute;z-index:3;top:10px;right:10px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid #ffffff2e;background:#00000066;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff;font-size:18px;line-height:1;opacity:0;transform:scale(.8);transition:opacity .3s,transform .3s var(--ease),background .2s}
.movie-card:hover .card-watch,.movie-card:focus-within .card-watch{opacity:1;transform:none}
.card-watch:hover{background:#fff;color:#000}
.skeleton{background:linear-gradient(110deg,#1c1c1e 8%,#2c2c2e 18%,#1c1c1e 33%);background-size:200% 100%;animation:shine 1.4s linear infinite}

/* Browse, search and My List */
.search-page{padding:120px var(--gutter) 0;min-height:70vh}
.search-page .section-heading{padding:0}
.search-page h2{font-size:clamp(1.9rem,3.6vw,3rem);letter-spacing:-.045em}.search-page h2:after{content:none}
.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0 32px}
.pill{border:1px solid var(--hair);background:#ffffff14;color:var(--soft);border-radius:999px;padding:9px 20px;font-size:.86rem;font-weight:600;transition:background .25s,color .25s}
.pill:hover{background:#ffffff26;color:#fff}.pill.active{background:#fff;border-color:#fff;color:#000}

.episode-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.episode-search-wrap{display:flex;align-items:center;gap:10px;flex:1;min-width:0;max-width:480px;padding:0 14px;height:44px;border:1px solid var(--hair);border-radius:13px;background:#ffffff08;color:var(--muted);transition:border-color .2s,background .2s}
.episode-search-wrap:focus-within{border-color:#ffffff58;background:#ffffff0d}
.episode-search-wrap svg{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.episode-search-wrap input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:.88rem}
.episode-search-wrap input::placeholder{color:var(--muted)}
.episode-count{flex:0 0 auto;color:var(--muted);font-size:.77rem;font-variant-numeric:tabular-nums}
.episode-list{display:grid;gap:12px;margin-top:14px}
.episode-load-more{display:block;margin:18px auto 0;padding:10px 18px;border:1px solid var(--hair);border-radius:999px;background:#ffffff0a}
.episode-load-more:hover{background:#ffffff18}
.episode-load-more[hidden]{display:none!important}
.episode-card{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr);gap:14px;align-items:start;padding:12px;border:1px solid var(--hair);border-radius:14px;background:#ffffff06;color:inherit;text-align:left;width:100%;cursor:pointer;transition:background .2s,border-color .2s}.episode-card:hover{background:#ffffff0d;border-color:#ffffff42}.episode-card.selected{border-color:var(--gold);background:#ffd60a0c}.episode-card:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.episode-still{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;background:var(--panel)}
.episode-copy{min-width:0}.episode-title{font-size:.96rem;font-weight:700;line-height:1.35}.episode-meta{margin-top:5px;color:var(--muted);font-size:.78rem}.episode-overview{margin:7px 0 0;color:var(--soft);font-size:.84rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.episode-empty{padding:14px;border:1px solid var(--hair);border-radius:12px;color:var(--muted);font-size:.88rem}
@media(max-width:760px){.episode-tools{align-items:stretch;flex-direction:column;gap:8px}.episode-search-wrap{max-width:none;width:100%;height:42px}.episode-count{align-self:flex-end}.episode-card{grid-template-columns:112px minmax(0,1fr);gap:10px;padding:9px}.episode-title{font-size:.88rem}.episode-overview{font-size:.78rem;-webkit-line-clamp:2}}
.filter-control{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.84rem;font-weight:500}
.filter-control select,.selects select,.player-top select{background:var(--panel2);color:#fff;border:1px solid var(--hair);border-radius:12px;padding:9px 12px;font-size:.86rem}
.filter-control select{max-width:190px}.filter-control select:hover,.filter-control select:focus,.selects select:hover{border-color:#ffffff59}
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,205px),1fr));gap:30px var(--gap);padding:10px 0}
.empty{padding:44px 20px;border:1px dashed #ffffff2e;border-radius:20px;color:var(--muted);text-align:center}
.empty-state{padding:32px 0;color:var(--muted)}
.error-box{border-radius:18px;background:var(--panel);box-shadow:inset 0 0 0 1px #ff453a66;padding:20px;color:#ffd1ce}
.tiny-note{font-size:.8rem;color:var(--muted);line-height:1.7}
.footer{padding:56px var(--gutter) 120px;max-width:920px;color:#636366;font-size:.8rem}.footer a{color:var(--soft)}
.mobile-nav{display:none}
.loading-line{height:2px;background:#ffffff14;overflow:hidden}.loading-line:after{content:"";display:block;height:100%;width:35%;background:#fff;border-radius:2px;animation:load 1.1s ease-in-out infinite}

/* Detail sheet */
.overlay{position:fixed;inset:0;z-index:80;display:none;align-items:stretch;justify-content:stretch;padding:0;background:#0000008c;backdrop-filter:blur(34px) saturate(140%);-webkit-backdrop-filter:blur(34px) saturate(140%)}
.overlay.open{display:flex;animation:fadeIn .3s ease}
.modal{position:relative;width:100%;max-width:none;height:100dvh;max-height:100dvh;overflow:auto;background:var(--panel);border-radius:0;box-shadow:none;animation:modalIn .45s var(--ease)}
.close{position:absolute;top:16px;right:16px;z-index:90;float:none;margin:0;width:36px;height:36px;border:1px solid var(--hair);border-radius:50%;background:#00000073;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;font-size:22px;line-height:1;display:grid;place-items:center;transition:background .2s}.close:hover{background:#ffffff40}.close:hover{background:#ffffff40}
.detail-hero{position:relative;isolation:isolate;overflow:hidden;height:clamp(360px,54vw,500px);min-height:360px;padding:0 48px 38px;display:flex;align-items:flex-end;background:var(--panel2) center/cover no-repeat}
.detail-hero-artwork{position:absolute;inset:0;z-index:0;display:block;width:100%;height:100%;object-fit:cover;object-position:center center;pointer-events:none;max-width:none;transform:none;clip-path:none}
.detail-hero:before{content:"";position:absolute;z-index:1;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(28,28,30,.82) 0%,rgba(28,28,30,.30) 18%,transparent 42%)}
.detail-copy{position:relative;z-index:2;max-width:680px}
.detail-back{position:absolute;top:16px;left:16px;z-index:8;display:inline-flex;align-items:center;gap:8px;margin:0;padding:9px 15px;border:1px solid #ffffff30;border-radius:999px;background:#00000075;color:#fff;font-size:.84rem;font-weight:600;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 #ffffff12;transition:background .2s,border-color .2s,transform .2s}
.detail-back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.detail-back:hover{background:#ffffff22;border-color:#ffffff65;transform:translateX(-2px)}
.detail-back[hidden]{display:none!important}
.detail-copy h2{font-size:clamp(2.2rem,5vw,3.8rem);font-weight:700;line-height:1.02;letter-spacing:-.045em;margin:8px 0 14px;text-wrap:balance}
.detail-copy .actions{justify-content:flex-start}
.detail-copy .meta{justify-content:flex-start}
.detail-copy .eyebrow{justify-content:flex-start}
.detail-body{padding:6px 48px 44px}
.detail-overview{max-width:68ch;margin:8px 0 10px;color
